[project]
name = "dna-foundation-model"
version = "0.1.0"
description = "DNA Foundation Model using LLM2Vec methodology"
requires-python = ">=3.12,<3.14"
dependencies = [
    # PyTorch 2.7 with CUDA 12.8 — required for RTX 5090 (Blackwell sm_120)
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "torchaudio>=2.7.0",
    # HuggingFace stack
    "transformers>=4.51.0",
    "accelerate>=1.6.0",
    "huggingface-hub>=0.30.0",
    "datasets>=3.5.0",
    "tokenizers>=0.21.0",
    # Utilities
    "numpy>=2.2.0",
    "tqdm>=4.67.0",
    "safetensors>=0.5.3",
    "scipy>=1.15.0",
    "wandb>=0.25.1",
    "scikit-learn>=1.8.0",
    "genomic-benchmarks>=1.0.0",
    "peft>=0.14.0",
    "einops>=0.8.2",
    "matplotlib>=3.10.9",
    "umap-learn>=0.5.12",
]

[project.optional-dependencies]
# A100: stable cu128 完全支持 sm_80
a100 = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "torchaudio>=2.7.0",
]

[tool.uv]
# RTX 5090 (Blackwell sm_120) requires CUDA >= 12.8 and PyTorch >= 2.6
# cu128 wheels are the latest stable CUDA build for PyTorch 2.7+
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
torchvision = [
    { index = "pytorch-cu128" },
]
torchaudio = [
    { index = "pytorch-cu128" },
]
